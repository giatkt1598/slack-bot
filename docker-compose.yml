services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # Published on localhost only so the worker on the Windows host can connect. Never expose publicly.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
    depends_on:
      - redis
    volumes:
      - bot-data:/data

volumes:
  redis-data:
  bot-data:
